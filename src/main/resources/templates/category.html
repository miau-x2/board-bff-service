<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Category Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/assets/css/category.css}">
</head>
<body>
<div th:replace="~{fragments/header :: mainHeader}"></div>

<main class="container py-4 category-page">
    <section class="card border-0 shadow-sm">
        <div class="card-body p-4">
            <div class="alert alert-danger mb-3"
                 th:if="${globalErrorMessage != null}"
                 th:text="${globalErrorMessage}">
            </div>

            <div class="d-flex align-items-center justify-content-between mb-3">
                <h1 class="h5 mb-0">카테고리 목록</h1>
                <button type="button" class="btn btn-outline-dark btn-sm js-open-root-add">추가</button>
            </div>

            <ul class="list-group list-group-flush" th:if="${categoryTree != null and !#lists.isEmpty(categoryTree.roots)}">
                <li class="list-group-item px-0 py-3" th:each="root : ${categoryTree.roots}">
                    <div class="d-flex justify-content-between align-items-start gap-3">
                        <div>
                            <div class="fw-semibold" th:text="${root.name}">상위 카테고리</div>
                            <div class="small text-body-secondary">
                                <span th:text="'slug: ' + ${root.slug}">slug: root</span>
                                <span class="mx-2">|</span>
                                <span th:text="'order: ' + ${root.displayOrder}">order: 1</span>
                            </div>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="button"
                                    class="btn btn-sm btn-outline-primary js-open-child-add"
                                    th:attr="data-parent-id=${root.id},data-parent-name=${root.name}">
                                추가
                            </button>
                            <button type="button"
                                    class="btn btn-sm btn-outline-secondary js-open-edit"
                                    th:attr="data-category-id=${root.id},data-category-name=${root.name},data-display-order=${root.displayOrder}">
                                수정
                            </button>
                        </div>
                    </div>

                    <div class="mt-3 child-block" th:if="${root.children != null and !#lists.isEmpty(root.children)}">
                        <div class="d-flex justify-content-between align-items-start gap-3 mb-2"
                             th:each="child : ${root.children}">
                            <div>
                                <div class="fw-semibold" th:text="${child.name}">하위 카테고리</div>
                                <div class="small text-body-secondary">
                                    <span th:text="'slug: ' + ${child.slug}">slug: child</span>
                                    <span class="mx-2">|</span>
                                    <span th:text="'order: ' + ${child.displayOrder}">order: 1</span>
                                </div>
                            </div>
                            <button type="button"
                                    class="btn btn-sm btn-outline-secondary js-open-edit"
                                    th:attr="data-category-id=${child.id},data-category-name=${child.name},data-display-order=${child.displayOrder}">
                                수정
                            </button>
                        </div>
                    </div>

                    <div class="mt-3 ps-3 small text-body-secondary"
                         th:if="${root.children == null or #lists.isEmpty(root.children)}">
                        하위 카테고리 없음
                    </div>
                </li>
            </ul>

            <div class="text-body-secondary small" th:if="${categoryTree == null or #lists.isEmpty(categoryTree.roots)}">
                등록된 카테고리가 없습니다.
            </div>
        </div>
    </section>
</main>

<div class="modal fade"
     id="categoryAddModal"
     tabindex="-1"
     aria-hidden="true"
     th:attr="data-open=${openCategoryAddModal != null ? openCategoryAddModal : false},data-mode=${categoryAddModalMode}">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header">
                <h2 class="modal-title fs-5" id="categoryAddModalTitle">카테고리 추가</h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
            </div>

            <form id="categoryAddForm"
                  method="post"
                  th:action="@{/admin/categories}"
                  th:object="${categoryAddFormData}">
                <div class="modal-body">
                    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="hidden" th:field="*{parentId}" id="modalParentId">

                    <div class="alert alert-danger"
                         th:if="${#fields.hasGlobalErrors()}"
                         th:text="${#fields.globalErrors()[0]}">
                    </div>

                    <div class="mb-3">
                        <label for="modalName" class="form-label">name</label>
                        <input id="modalName"
                               th:field="*{name}"
                               type="text"
                               class="form-control"
                               maxlength="50"
                               th:classappend="${#fields.hasErrors('name')} ? ' is-invalid' : ''">
                        <div id="modalNameFeedback"
                             class="invalid-feedback"
                             th:text="${#fields.hasErrors('name')} ? ${#fields.errors('name')[0]} : ''">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="modalSlug" class="form-label">slug</label>
                        <input id="modalSlug"
                               th:field="*{slug}"
                               type="text"
                               class="form-control"
                               maxlength="50"
                               th:classappend="${#fields.hasErrors('slug')} ? ' is-invalid' : ''">
                        <div id="modalSlugFeedback"
                             class="invalid-feedback"
                             th:text="${#fields.hasErrors('slug')} ? ${#fields.errors('slug')[0]} : ''">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="modalAddDisplayOrder" class="form-label">order</label>
                        <input id="modalAddDisplayOrder"
                               th:field="*{displayOrder}"
                               type="number"
                               min="0"
                               max="255"
                               class="form-control"
                               required
                               th:classappend="${#fields.hasErrors('displayOrder')} ? ' is-invalid' : ''">
                        <div id="modalAddDisplayOrderFeedback"
                             class="invalid-feedback"
                             th:text="${#fields.hasErrors('displayOrder')} ? ${#fields.errors('displayOrder')[0]} : ''">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-dark w-100" id="categoryAddModalSubmit">저장</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="modal fade"
     id="displayOrderEditModal"
     tabindex="-1"
     aria-hidden="true"
     th:attr="data-open=${openDisplayOrderEditModal != null ? openDisplayOrderEditModal : false}">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header">
                <h2 class="modal-title fs-5" id="displayOrderEditModalTitle">displayOrder 수정</h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
            </div>

            <form id="displayOrderEditForm"
                  method="post"
                  th:action="@{/admin/categories/display-order}"
                  th:object="${displayOrderEditFormData}">
                <div class="modal-body">
                    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="hidden" th:field="*{id}" id="modalEditCategoryId">

                    <div class="alert alert-danger"
                         th:if="${#fields.hasGlobalErrors()}"
                         th:text="${#fields.globalErrors()[0]}">
                    </div>

                    <div class="mb-3">
                        <label for="modalEditDisplayOrder" class="form-label">order</label>
                        <input id="modalEditDisplayOrder"
                               th:field="*{displayOrder}"
                               type="number"
                               min="0"
                               max="255"
                               class="form-control"
                               required
                               th:classappend="${#fields.hasErrors('displayOrder')} ? ' is-invalid' : ''">
                        <div id="modalEditDisplayOrderFeedback"
                             class="invalid-feedback"
                             th:text="${#fields.hasErrors('displayOrder')} ? ${#fields.errors('displayOrder')[0]} : ''">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-dark w-100">수정</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<script th:src="@{/assets/js/header.js}" defer></script>
<script th:src="@{/assets/js/category.js}" defer></script>
</body>
</html>
