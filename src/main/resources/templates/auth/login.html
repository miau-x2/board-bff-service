<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>로그인</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link th:href="@{/assets/css/login.css}" rel="stylesheet" />
</head>

<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">
            <div class="card shadow-sm login-card">
                <div class="card-body p-4 p-md-5">
                    <h1 class="h4 mb-4 text-center">로그인</h1>

                    <form id="loginForm"
                          th:action="@{/login}"
                          th:object="${loginFormData}"
                          method="post"
                          novalidate>

                        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <input type="hidden" name="redirect" th:value="${redirect}" />

                        <div id="globalError"
                             class="alert alert-danger py-2"
                             role="alert"
                             th:if="${loginGlobalErrorMessage != null}"
                             th:text="${loginGlobalErrorMessage}">
                        </div>

                        <div class="mb-3">
                            <label for="username" class="form-label">아이디</label>
                            <input id="username"
                                   type="text"
                                   class="form-control"
                                   th:field="*{username}"
                                   autocomplete="username" />
                            <div class="field-feedback"></div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">비밀번호</label>
                            <div class="position-relative">
                                <input id="password"
                                       type="password"
                                       class="form-control pe-5"
                                       th:classappend="${loginFieldErrorMessage != null} ? ' is-invalid' : ''"
                                       name="password"
                                       autocomplete="current-password"
                                       aria-describedby="passwordFeedback" />

                                <span id="togglePasswordBtn"
                                      class="password-toggle"
                                      role="button"
                                      tabindex="-1"
                                      aria-label="비밀번호 보기/숨기기"
                                      aria-pressed="false">
                                    <i id="togglePasswordIcon" class="bi bi-eye-slash" aria-hidden="true"></i>
                                </span>
                            </div>

                            <div id="passwordFeedback"
                                 class="field-feedback is-invalid"
                                 th:if="${loginFieldErrorMessage != null}"
                                 th:text="${loginFieldErrorMessage}">
                            </div>
                        </div>

                        <div class="d-grid mt-4">
                            <button id="loginBtn" type="submit" class="btn btn-outline-primary">
                                로그인
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<script th:src="@{/assets/js/login.js}" defer></script>
</body>
</html>
