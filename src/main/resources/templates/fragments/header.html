<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<th:block th:fragment="mainHeader">
    <link rel="stylesheet" th:href="@{/assets/css/header.css}">

    <header class="bg-white border-bottom">
        <div class="container py-3 d-flex justify-content-between align-items-center">
            <a href="/" class="logo text-decoration-none">BOARD</a>

            <div class="d-flex align-items-center gap-2" sec:authorize="isAuthenticated()">
                <form method="post" action="/logout" class="js-return-to-form">
                    <input type="hidden" name="returnTo" class="js-return-to-input">
                    <button type="submit" class="btn btn-outline-dark btn-sm">로그아웃</button>
                </form>
            </div>

            <div class="d-flex align-items-center gap-2" sec:authorize="isAnonymous()">
                <a class="btn btn-outline-dark btn-sm js-login-link" href="/login" data-login-path="/login">로그인</a>
            </div>
        </div>
    </header>

    <nav class="bg-black" aria-label="category">
        <div class="container">
            <ul class="nav category-nav">
                <li class="nav-item dropdown" th:each="root : ${headerMenuRoots}">
                    <a class="nav-link text-white category-link category-root-link dropdown-toggle"
                       th:if="${root.children != null and !#lists.isEmpty(root.children)}"
                       th:href="@{/posts(category=${root.children[0].slug})}"
                       th:text="${root.name}">
                        루트 카테고리
                    </a>
                    <a class="nav-link text-white category-link category-root-link dropdown-toggle"
                       th:unless="${root.children != null and !#lists.isEmpty(root.children)}"
                       href="#"
                       th:text="${root.name}">
                        루트 카테고리
                    </a>

                    <ul class="dropdown-menu category-dropdown">
                        <li th:if="${root.children == null or #lists.isEmpty(root.children)}">
                            <span class="dropdown-item-text text-muted">하위 카테고리 없음</span>
                        </li>
                        <li th:each="child : ${root.children}">
                            <a class="dropdown-item category-child-link"
                               href="#"
                               th:attr="data-slug=${child.slug}"
                               th:text="${child.name}">
                                하위 카테고리
                            </a>
                        </li>
                    </ul>
                </li>
                <li class="nav-item" th:if="${headerMenuRoots == null or #lists.isEmpty(headerMenuRoots)}">
                    <span class="nav-link text-white-50">카테고리 없음</span>
                </li>
            </ul>
        </div>
    </nav>
</th:block>
</body>
</html>
